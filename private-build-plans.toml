# Hari Mono: an Iosevka build for terminals and editors, in the spirit of Berkeley Mono.
# Glyph choices and metrics start from Ioskeley Mono by Ahmed Hatem (OFL 1.1),
# https://github.com/ahatem/IoskeleyMono, built on Iosevka by Renzhi Li (OFL 1.1).
# build.sh builds both plans, then postprocess.py fits a few symbols using the narrow donor.

[buildPlans.HariMono]
family = "Hari Mono"
spacing = "term"
serifs = "sans"
noCvSs = true
noLigation = true
exportGlyphNames = true

[buildPlans.HariMono.variants.design]
one = "no-base"
two = "straight-neck-serifless"
three = "flat-top-serifless"
four = "semi-open-serifless"
five = "oblique-flat-hook-serifless"
six = "open-contour"
seven = "straight-serifless"
eight = "two-circles"
nine = "open-contour"
zero = "dotted"
capital-a = "straight-serifless"
capital-b = "standard-serifless"
capital-c = "bilateral-inward-serifed"
capital-d = "more-rounded-serifless"
capital-e = "serifless"
capital-f = "serifless"
capital-g = "toothless-corner-inward-serifed-hooked"
capital-h = "serifless"
capital-i = "short-serifed"
capital-j = "serifless"
capital-k = "straight-bottom-right-serifed"
capital-l = "serifless"
capital-m = "hanging-serifless"
capital-n = "standard-serifless"
capital-p = "closed-serifless"
capital-q = "crossing"
capital-r = "standing-serifless"
capital-s = "bilateral-inward-serifed"
capital-t = "serifless"
capital-u = "toothless-rounded-serifless"
capital-v = "straight-serifless"
capital-w = "straight-flat-top-serifless"
capital-x = "straight-serifless"
capital-y = "straight-serifless"
capital-z = "straight-serifless"
a = "double-storey-serifless"
b = "toothed-serifless"
c = "bilateral-inward-serifed"
d = "toothed-serifless"
e = "flat-crossbar"
f = "flat-hook-serifless-crossbar-at-x-height"
g = "single-storey-serifless"
h = "straight-serifless"
i = "serifed"
j = "flat-hook-serifed"
k = "straight-serifless"
l = "serifed"
m = "serifless"
n = "straight-serifless"
p = "eared-serifless"
q = "straight-serifless"
r = "hookless-serifless"
s = "serifless"
t = "flat-hook-short-neck2"
u = "toothed-serifless"
v = "straight-serifless"
w = "straight-flat-top-serifless"
x = "straight-serifless"
y = "straight-serifless"
z = "straight-serifless"
lower-theta = "oval"
tittle = "square"
diacritic-dot = "square"
punctuation-dot = "square"
braille-dot = "square"
tilde = "low"
asterisk = "penta-low"
underscore = "high"
caret = "low"
ascii-grave = "straight"
ascii-single-quote = "straight"
paren = "flat-arc"
brace = "straight"
guillemet = "straight"
number-sign = "slanted"
ampersand = "closed"
at = "fourfold-solid-inner"
dollar = "through"
cent = "through-cap"
percent = "rings-continuous-slash"
bar = "natural-slope"
question = "corner"
pilcrow = "high"
micro-sign = "toothed-serifless"
decorative-angle-brackets = "middle"
lig-ltgteq = "slanted"
lig-neq = "slightly-slanted"
lig-equal-chain = "without-notch"
lig-hyphen-chain = "without-notch"
lig-plus-chain = "without-notch"
lig-double-arrow-bar = "without-notch"
lig-single-arrow-bar = "without-notch"

[buildPlans.HariMono.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.HariMono.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.HariMono.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.HariMono.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.HariMono.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.HariMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

# Slanted roman rather than Iosevka's cursive italic, so the upright letter shapes carry over.
[buildPlans.HariMono.slopes.Italic]
angle = 9.4
shape = "oblique"
menu = "italic"
css = "italic"

[buildPlans.HariMono.metricOverride]
xHeight = 520
cap = 690
ascender = 740
sb = 85
accentWidth = 182
accentClearance = 76
accentHeight = 162
accentStackOffset = 208
leading = 1250
parenSize = 860
dotSize = 'blend(weight, [100, 110], [400, 125], [900, 150])'
periodSize = 140
essRatio = 1.03
essRatioUpper = 1.03
essRatioLower = 1.03
essRatioQuestion = 1.03
archDepth = 152
smallArchDepth = 157
symbolMid = 313

[buildPlans.HariMono.namingOverride]
copyright = "Copyright 2015-2026 Renzhi Li (Iosevka); Copyright 2025 Ahmed Hatem (Ioskeley Mono); Copyright 2026 Vimal Hari (Hari Mono)"
designer = "Vimal Hari"
manufacturer = "Vimal Hari"
urlDesigner = "https://github.com/zorinto/hari-mono"
licence = "This Font Software is licensed under the SIL Open Font License, Version 1.1."
licenceURL = "https://openfontlicense.org"
version = "1.1.0"
vendorIdTag = "HARI"

# Donor build at width 500: narrower symbols at the same stroke weight, used only by postprocess.py.
[buildPlans.HariMonoDonor]
family = "Hari Mono Donor"
spacing = "term"
serifs = "sans"
noCvSs = true
noLigation = true
weights.inherits = "buildPlans.HariMono"
slopes.inherits = "buildPlans.HariMono"

[buildPlans.HariMonoDonor.variants]
inherits = "buildPlans.HariMono"

[buildPlans.HariMonoDonor.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.HariMonoDonor.metricOverride]
xHeight = 520
cap = 690
ascender = 740
sb = 85
accentWidth = 182
accentClearance = 76
accentHeight = 162
accentStackOffset = 208
leading = 1250
parenSize = 860
dotSize = 'blend(weight, [100, 110], [400, 125], [900, 150])'
periodSize = 140
essRatio = 1.03
essRatioUpper = 1.03
essRatioLower = 1.03
essRatioQuestion = 1.03
archDepth = 152
smallArchDepth = 157
symbolMid = 313
