name: Build and release

# Tag push (git tag v1.0.0 && git push origin v1.0.0) builds and publishes a release.
# Manual runs build the same archives and keep them as workflow artifacts only.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install system tools
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do sudo apt-get update && break; sleep 5; done
          for i in 1 2 3; do sudo apt-get install -y ttfautohint fontforge zip && break; sleep 5; done

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Build fonts
        run: JOBS=4 ./build.sh

      - name: Package archives
        run: ./package.sh

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hari-mono-${{ github.ref_name }}
          path: dist/release/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/release/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
