name: Build and release

# Tag push (git tag v1.0.0 && git push origin v1.0.0) builds and publishes a release.
# Manual runs build the same archives and keep them as workflow artifacts only.
# Actions are pinned to commit SHAs; only the publish job can write to the repository.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches the font version
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" private-build-plans.toml || { echo "Tag $GITHUB_REF_NAME does not match namingOverride.version"; exit 1; }

      - name: Install system tools
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do sudo apt-get update && break; sleep 5; done
          for i in 1 2 3; do sudo apt-get install -y ttfautohint fontforge zip && break; sleep 5; done

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build fonts
        run: JOBS=4 ./build.sh

      - name: Package archives
        run: ./package.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hari-mono
          path: dist/release/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hari-mono
          path: release

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
